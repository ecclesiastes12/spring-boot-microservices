#RabbitMQ server default configuration values running on docker desktop
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#application name
spring.application.name=EMPLOYEE-SERVICE

#configure the config-server uri so that employee-service can load the configuration file
#from the config-server
spring.config.import=optional:configserver:http://localhost:8888

#configure eureka url for employee
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

#zipkin server base url
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# configure sampling and loging pattern for all incoming request
management.tracing.sampling.probability=1.0


# Actuator endpoints for circuit breaker
#enabled health endpoint for circuit breaker
management.health.circuitbreakers.enabled=true
# expose the health endpoint point of circuit breaker
management.endpoints.web.exposure.include=health
# show all the health details of the circuit breaker health 
management.endpoint.health.show-details=always

